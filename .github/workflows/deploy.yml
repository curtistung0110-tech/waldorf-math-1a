name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  github-pages:
    name: GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

  cloudflare-pages:
    name: Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME || 'waldorf-math-1a' }}
    steps:
      - name: Check Cloudflare settings
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::尚未設定 CLOUDFLARE_API_TOKEN（secret）或 CLOUDFLARE_ACCOUNT_ID（variable），略過 Cloudflare Pages 部署。"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Create Cloudflare Pages project if missing
        if: steps.check.outputs.ready == 'true'
        run: npx --yes wrangler@4 pages project create "$CLOUDFLARE_PROJECT_NAME" --production-branch=main || echo "專案已存在，直接部署。"

      - name: Deploy to Cloudflare Pages
        if: steps.check.outputs.ready == 'true'
        run: npx --yes wrangler@4 pages deploy site --project-name="$CLOUDFLARE_PROJECT_NAME" --branch=main --commit-dirty=true
